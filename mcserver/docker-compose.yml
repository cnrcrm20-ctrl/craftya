# Craftya Minecraft Sunucusu — PaperMC + Geyser (Bedrock) + playit tüneli
#
#   cp .env.example .env      # ayarları düzenle
#   ./scripts/fetch-plugins.sh
#   docker compose up -d      # düz başlat
#   docker compose --profile tunnel up -d   # tünel de olsun (playit)
#
# Servisler:
#   minecraft : asıl sunucu (Paper = Spigot'un hızlı fork'u, tüm ciddi sunucular bunu kullanır)
#   playit    : IP'nde port açamıyorsan dışarıya köprü, sabit adres verir
#   backup    : 6 saatte bir dünya yedeği, 7 gün saklar
#
# NOT: Geyser/Floodgate ayrı konteyner DEĞİL, plugin. Böylece telefon (Bedrock) ve
# PC (Java) oyuncuları AYNI dünyada, aynı oyuncu listesinde buluşur.

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: craftya-mc
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"          # Java Edition (TCP)
      - "19132:19132/udp"      # Bedrock/Geyser (UDP) — Geyser plugin'i bu portu dinler
      - "127.0.0.1:25575:25575"  # RCON sadece localhost'a açık
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MC_MEMORY:-3G}"

      # ---- sunucu kimliği ----
      MOTD: "${MC_MOTD:-\\u00a7aCraftya\\u00a77 · sunucu dünyası}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-20}"
      LEVEL_SEED: "${MC_SEED:-craftya}"
      MODE: "survival"
      DIFFICULTY: "normal"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      SPAWN_PROTECTION: "0"

      # ---- güvenlik ----
      ONLINE_MODE: "${MC_ONLINE_MODE:-TRUE}"
      ENABLE_WHITELIST: "${MC_WHITELIST:-FALSE}"
      WHITELIST: "${MC_WHITELIST_NAMES:-}"
      OPS: "${MC_OPS:-}"
      ENFORCE_SECURE_PROFILE: "TRUE"

      # ---- performans (Aikar GC bayrakları: Paper için standart) ----
      USE_AIKAR_FLAGS: "true"

      # ---- uzaktan yönetim ----
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-craftya-rcon}"

      # ---- plugin yönetimi ----
      # config/ klasörü /data'nın üstüne kopyalanır (bukkit.yml, spigot.yml, paper-global.yml)
      COPY_CONFIG_DEST: "/data"
      # plugins/ klasöründeki jar'lar her açılışta /data/plugins'e senkronlanır
      COPY_PLUGINS_SRC: "/plugins"
      REMOVE_OLD_MODS: "FALSE"     # elle atılan plugin'leri ezmesin

      # ---- opsiyonel eklentiler: Modrinth'ten sürüm çözümüyle ----
      # Boş bırakırsan hiçbiri kurulmaz. Açmak için .env'de MC_EXTRA_PLUGINS doldur.
      MODRINTH_PROJECTS: "${MC_EXTRA_PLUGINS:-}"
    volumes:
      - mc-data:/data
      - ./config:/config:ro
      - ./plugins:/plugins:ro
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      start_period: 240s
      retries: 5
    networks: [craftya]

  # Bedrock köprüsü Geyser plugin'i olarak çalışır (yukarıda 19132/udp).
  # Geyser ayarları: ./config/plugins/Geyser-Spigot/config.yml

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    container_name: craftya-playit
    restart: unless-stopped
    environment:
      SECRET_KEY: "${PLAYIT_SECRET:?playit SECRET_KEY gerekli}"
    network_mode: host
    depends_on:
      minecraft:
        condition: service_started
    profiles: ["tunnel"]

  backup:
    image: itzg/mc-backup
    container_name: craftya-backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "6h"
      BACKUP_METHOD: "tar"
      PRUNE_BACKUPS_DAYS: "7"
      RCON_HOST: minecraft
      RCON_PASSWORD: "${RCON_PASSWORD:-craftya-rcon}"
      PAUSE_IF_NO_PLAYERS: "true"
      INITIAL_DELAY: "5m"
    volumes:
      - mc-data:/data:ro
      - mc-backups:/backups
    depends_on:
      minecraft:
        condition: service_healthy
    networks: [craftya]

volumes:
  mc-data:
  mc-backups:

networks:
  craftya:
    driver: bridge
