# Bukkit ayarları — Craftya
# Birim: tick. 20 tick = 1 saniye. Küçük değer = daha sık kayıt = daha çok disk I/O.

settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: false
  deprecated-verbose: default
  shutdown-message: \u00a77Sunucu kapaniyor...
  minimum-api: none
  use-map-color-cache: true

# Dünya kaydı: autosave aralığı. 6000 tick = 5 dakika.
# Çok küçük yaparsan (600) disk yorulur; çok büyük yaparsan çökmede veri kaybı artar.
ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  water-spawns: 1
  water-underground-creature-spawns: 1
  axolotl-spawns: 1
  ambient-spawns: 1
  autosave: 6000

# Spawn sınırları — kalabalık sunucuda mob lag'inin ana kaynağı.
spawn-limits:
  monsters: 50
  animals: 8
  water-animals: 4
  water-ambient: 2
  water-underground-creature: 3
  axolotl: 3
  ambient: 1

chunk-gc:
  period-in-ticks: 400

aliases: {}
