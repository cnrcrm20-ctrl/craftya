# Paper global ayarları — Craftya
# /data/config/paper-global.yml üzerine kopyalanır.
# Paper'ın kendi optimizasyonları burada; varsayılanlar zaten iyi.
# Sadece bilinçli olarak değiştirdiğimiz satırlar var.

_version: 30

chunk-loading-advanced:
  auto-config-send-distance: true
  player-max-concurrent-chunk-generates: 0
  player-max-concurrent-chunk-loads: 0
chunk-loading-basic:
  player-max-chunk-generate-rate: -1.0
  player-max-chunk-load-rate: 100.0      # agresif ama güvenli üst sınır
  player-max-chunk-send-rate: 75.0
  target-player-chunk-send-rate: 100.0

chunk-system:
  worker-threads: -1
  io-threads: -1

collisions:
  enable-player-collisions: true
  send-full-pos-for-hard-colliding-entities: true

commands:
  suggest-player-names-when-null-tab-completions: true
  time-command-affects-all-worlds: false

console:
  enable-brigadier-completions: true
  enable-brigadier-highlighting: true
  has-all-permissions: false

item-validation:
  display-name:
    max-length: 8192
  lore:
    max-length: 8192

logging:
  deobfuscate-stacktraces: true
  log-player-ip-addresses: true
  use-rgb-for-named-text-colors: true

messages:
  # Türkçe sunucu: varsayılan mesajlar İngilizce ama oyuncuya giden kritik
  # mesajları Türkçe tutuyoruz.
  kick:
    authentication-servers-down: "\u00a7cKimlik sunuculari kapali, birazdan tekrar dene."
    connection-throttle: "\u00a7cCok hizli baglaniyorsun, 5 saniye bekle."
    flying-player: "\u00a7cUcma tespit edildi."
    flying-vehicle: "\u00a7cArac icinde ucus tespit edildi."
  no-permission: "\u00a7cBunun icin yetkin yok."

misc:
  max-joins-per-tick: 5
  region-file-cache-size: 256
  # Bu satır önemli: oyuncu isimlerinde renk/gizli karakter olmasın
  load-permissions-yml-before-plugins: true

proxies:
  bungee-cord:
    online-mode: true
  velocity:
    enabled: false
    online-mode: true
    secret: ''

scoreboard:
  allow-non-player-entities-on-scoreboards: true

# Anti-Xray: Paper'ın en güçlü özelliklerinden biri. X-ray hilesinin önüne geçer.
anti-xray:
  enabled: true
  engine-mode: 2          # 2 = hem blok gizleme hem obfuscation, en etkili
  max-block-height: 64
  update-radius: 2
  lava-obscures: false
  use-permission: false
  hidden-blocks:
    - copper_ore
    - deepslate_copper_ore
    - raw_copper_block
    - gold_ore
    - deepslate_gold_ore
    - iron_ore
    - deepslate_iron_ore
    - raw_iron_block
    - coal_ore
    - deepslate_coal_ore
    - lapis_ore
    - deepslate_lapis_ore
    - mossy_cobblestone
    - obsidian
    - chest
    - diamond_ore
    - deepslate_diamond_ore
    - redstone_ore
    - deepslate_redstone_ore
    - clay
    - emerald_ore
    - deepslate_emerald_ore
  replacement-blocks:
    - stone
    - deepslate
    - andesite
    - granite
    - diorite
    - tuff
    - oak_planks
