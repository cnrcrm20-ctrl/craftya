# Geyser — Java sunucusuna Bedrock (telefon/tablet/konsol) köprüsü
# Bu dosya /data/plugins/Geyser-Spigot/config.yml üzerine kopyalanır.
# Değişiklikten sonra: docker compose restart minecraft  (veya /geyser reload)

bedrock:
  # Bedrock istemcilerinin bağlandığı UDP portu. Yönlendirmede 19132/udp açık olmalı.
  port: 19132
  # Aynı makinede başka bir Bedrock sunucusu varsa bunu true yap.
  clone-remote-port: false
  # 26.60 sonrası Bedrock istemcileri NetherNet kullanıyor; Geyser tarafında da
  # bu taşıma katmanı seçilirse yeni istemciler sorunsuz bağlanır.
  # Eski Bedrock sürümleriyle sorun yaşarsan "raknet" yap.
  transport: nethernet
  motd1: "Craftya"
  motd2: "sunucu dunyasi"
  # Sunucu adı (Bedrock sunucu listesinde görünür)
  server-name: "Craftya"
  
remote:
  # Geyser kendi sunucusuna mı yoksa arkadaki Java sunucusuna mı bağlanıyor
  address: 127.0.0.1
  port: 25565
  # Bedrock oyuncuları için Java hesabı ZORUNLU olmasın (Floodgate ile eşleşir)
  auth-type: floodgate

# ---- performans ----
# Bedrock istemcisi Java'dan daha ağır paket üretir; bu ayarlar sınırları çeker.
max-players: 20
debug-mode: false
show-cooldown: title
show-coordinates: true
truncate-chat-messages: false
scoreboard-packet-threshold: 20

# ---- görünüm ----
# Bedrock'ta chunk yüklemesi yavaş: mesafeyi Java'dan biraz düşük tut.
default-locale: tr_tr

# ---- güvenlik ----
# Floodgate kullanılıyorsa imza anahtarı ilk açılışta üretilir.
# Bu dosya sır içermez; anahtar /data/plugins/floodgate/key.pem altında.
allow-third-party-capes: true
allow-third-party-ears: false
