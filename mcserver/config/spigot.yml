# Spigot ayarları — Craftya
# Dikkat: bu dosyadaki agresif değerler oyunu bozar. Aşağıdakiler "ölçülü" ayarlar:
# entity activation range düşürüldü ama oyuncunun gördüğü mob'lar hâlâ tick alıyor.

settings:
  save-user-cache-on-stop-only: false
  bungeecord: false
  user-cache-size: 1000
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 1024.0
    attackDamage:
      max: 2048.0
  timeout-time: 60
  restart-on-crash: false     # systemd/docker zaten yeniden başlatıyor
  restart-script: ./start.sh
  netty-threads: 4
  log-villager-deaths: true
  log-named-deaths: true

messages:
  whitelist: \u00a7cBeyaz listede degilsin.
  unknown-command: \u00a77Bilinmeyen komut.
  server-full: \u00a7cSunucu dolu.
  outdated-client: \u00a7cIstemcin eski, Minecraft'i guncelle.
  outdated-server: \u00a7cSunucu eski, yoneticiye haber ver.
  restart: \u00a77Sunucu yeniden basliyor...

# Entity tick mesafeleri — TPS'in en büyük düşmanı burada.
world-settings:
  default:
    below-zero-generation-in-existing-chunks: true
    view-distance: default
    simulation-distance: default
    thunder-chance: 100000
    merge-radius:
      item: 2.5
      exp: 3.0
    item-despawn-rate: 6000
    nerf-spawner-mobs: false
    zombie-aggressive-towards-villager: true
    entity-activation-range:
      animals: 24        # 32 → 24: 24 blok ötedeki inek artık tick almıyor
      monsters: 28
      raiders: 48
      misc: 8
      water: 16
      villagers: 32
      flying-monsters: 32
      wake-up-inactive:
        animals-max-per-tick: 4
        animals-every: 1200
        animals-for: 100
        monsters-max-per-tick: 8
        monsters-every: 400
        monsters-for: 100
        villagers-max-per-tick: 4
        villagers-every: 600
        villagers-for: 100
        flying-monsters-max-per-tick: 8
        flying-monsters-every: 200
        flying-monsters-for: 100
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 1
    hopper-can-load-chunks: false   # chunk yüklemesin: en pahalı hata
    max-tnt-per-tick: 100
    max-entity-collisions: 8
    mob-spawn-range: 6              # view-distance 8 ile uyumlu
    arrow-despawn-rate: 1200
    trident-despawn-rate: 1200
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-slime: 987234911
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645
    hunger:
      jump-walk-exhaustion: 0.05
      jump-sprint-exhaustion: 0.2
      combat-exhaustion: 0.1
      regen-exhaustion: 6.0
      swim-multiplier: 0.01
      sprint-multiplier: 0.1
      other-multiplier: 0.0
