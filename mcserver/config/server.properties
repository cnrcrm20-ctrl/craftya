# Minecraft sunucu özellikleri — Craftya
# itzg imajı bu dosyayı /data/server.properties üzerine kopyalar.
# Elle düzenlenebilir; sunucu kapalıyken değiştir, yoksa açılışta ezilir.

# ---- kimlik ----
motd=\u00a7aCraftya \u00a78| \u00a7fsunucu dunyasi
server-port=25565
max-players=20
online-mode=true
enforce-secure-profile=true

# ---- oyun ----
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
allow-flight=false
force-gamemode=false
level-name=world
level-seed=craftya
level-type=minecraft\:normal
spawn-protection=0
max-world-size=29999984

# ---- performans (Paper için ölçülü değerler) ----
view-distance=8
simulation-distance=6
entity-broadcast-range-percentage=75
max-tick-time=60000
sync-chunk-writes=false
network-compression-threshold=256
use-native-transport=true

# ---- güvenlik / erişim ----
white-list=false
enforce-whitelist=true
allow-nether=true
allow-end=true
enable-command-block=false
op-permission-level=4
function-permission-level=2
prevent-proxy-connections=false

# ---- görünürlük ----
enable-status=true
hide-online-players=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
enable-rcon=true
rcon.port=25575

# ---- kayıt / yedek ----
enable-query=false
max-build-height=320
player-idle-timeout=0

# rcon.password satırı BİLİNÇLİ olarak yok: değer .env içindeki RCON_PASSWORD'den
# gelir. Düz metin sır repoda durmaz.
