apply plugin: 'com.android.application'

android {
    namespace 'com.craftya.game'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.craftya.game"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "3.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -fno-exceptions -fno-rtti -fno-math-errno"
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-24"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/keys/craftya-release.p12")
            storePassword System.getenv("CRAFTYA_STORE_PASS") ?: "Craftya2026Release"
            keyAlias "craftya"
            keyPassword System.getenv("CRAFTYA_KEY_PASS") ?: "Craftya2026Release"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk { debugSymbolLevel 'none' }
        }
    }

    // sadece arm64 — APK boyutu küçük kalsın (hedef: 25 MB altı)
    splits {
        abi {
            enable false
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
