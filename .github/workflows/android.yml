name: Android APK

on:
  push:
    branches: [ 'arena/deab440e-craftya' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android komut satiri araclari
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: SDK + NDK kur
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Motor testleri (masaustu)
        run: ./build.sh

      - name: APK derle
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK artefakt
        uses: actions/upload-artifact@v4
        with:
          name: craftya-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Release olustur
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" \
            android/app/build/outputs/apk/release/*.apk \
            --title "Craftya 0.2.${{ github.run_number }}" \
            --notes "Otomatik derleme · ${{ github.sha }}" || \
          gh release upload "v0.2.${{ github.run_number }}" \
            android/app/build/outputs/apk/release/*.apk --clobber
