name: Android APK

on:
  push:
    branches: [ 'arena/deab440e-craftya' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android komut satiri araclari
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: SDK + NDK kur
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Motor testleri (masaustu)
        run: ./build.sh

      - name: APK derle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Gradle log artefakti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

      - name: Hata ayiklama (annotation olarak yayinla)
        if: failure()
        shell: bash
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            echo "::error::gradle.log olusmadi (derleme baslamadi)"
            exit 0
          fi
          echo "=== INCELEME: toplam satir $(wc -l < /tmp/gradle.log) ==="
          # en kritik satirlari annotation olarak yayinla (GitHub API'den okunabilir)
          grep -n -iE "error:|FAILED|Caused by|undefined reference|No such file|cannot find|\* What went wrong" /tmp/gradle.log \
            | head -25 \
            | while IFS= read -r line; do
                echo "::error title=GRADLE::$line"
              done
          echo "=== BAGLAM: son 40 satir ==="
          tail -40 /tmp/gradle.log | while IFS= read -r line; do
            echo "::warning title=SON::$line"
          done

      - name: APK yerini bul
        run: |
          echo "== APK arama =="
          find android \( -name "*.apk" -o -name "*.aab" \) -type f 2>/dev/null | tee /tmp/apks.txt
          du -h /tmp/apks.txt 2>/dev/null || true
          while read -r f; do ls -lh "$f"; done < /tmp/apks.txt
          echo "== cikti klasoru =="
          find android -path "*outputs*" -name "*.apk" -o -path "*outputs*" -type d 2>/dev/null | head -30
          if [ ! -s /tmp/apks.txt ]; then
            echo "APK BULUNAMADI"
            find android/app/build -maxdepth 3 -type d 2>/dev/null | head -30
            exit 1
          fi
          mkdir -p /tmp/apkout
          while read -r f; do cp "$f" /tmp/apkout/; done < /tmp/apks.txt
          ls -la /tmp/apkout

      - name: APK icerik denetimi (acilabilirlik + giris sembolu)
        run: |
          set -o pipefail
          APK=$(ls /tmp/apkout/*.apk | head -1)
          echo "== $APK =="
          ls -lh "$APK"
          echo "== zip icerigi (ilk 40) =="
          unzip -l "$APK" | head -40
          echo "== BLOKLARI DENETLE =="
          unzip -l "$APK" | grep -qE 'classes[0-9]*\.dex' \
            && echo "! dex var (hasCode=true olmali)" \
            || echo "+ dex YOK (hasCode=false dogru)"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libcraftya.so' \
            && echo "+ libcraftya.so VAR" \
            || { echo "::error::libcraftya.so APK icinde YOK — oyun kodu paketlenmemis"; exit 1; }
          mkdir -p /tmp/apkx && cd /tmp/apkx && rm -rf * && unzip -oq "$APK"
          echo "== libcraftya.so boyutu ve girdi sembolu =="
          ls -lh lib/arm64-v8a/libcraftya.so
          NM=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)
          echo "nm: $NM"
          "$NM" -D --defined-only lib/arm64-v8a/libcraftya.so > /tmp/syms.txt
          grep -c . /tmp/syms.txt | xargs echo "acik sembol sayisi:"
          grep -q "ANativeActivity_onCreate" /tmp/syms.txt \
            && echo "+ ANativeActivity_onCreate VAR — APK acilabilir" \
            || { echo "::error::ANativeActivity_onCreate YOK — APK acilirken coker"; exit 1; }
          grep -q "android_main" /tmp/syms.txt \
            && echo "+ android_main VAR" || echo "! android_main sembolde yok (statik baglanmis olabilir)"
          echo "== manifest (kotlin/apktool yoksa aapt2 ile) =="
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | head -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | head -12 || true
          fi
          echo "== BOYUT: $(stat -c%s "$APK") bayt =="
          if [ "$(stat -c%s "$APK")" -lt 150000 ]; then
            echo "::error::APK cok kucuk (<150 KB) — yerel kutuphane paketlenmemis olabilir"
            exit 1
          fi

      - name: APK ozeti (is ozetine yaz)
        run: |
          APK=$(ls /tmp/apkout/*.apk | head -1)
          {
            echo "### Craftya APK dogrulama"
            echo ""
            echo "| Kontrol | Sonuc |"
            echo "|---|---|"
            echo "| Dosya | \`$(basename "$APK")\` |"
            echo "| Boyut | $(stat -c%s "$APK") bayt |"
            echo "| libcraftya.so | $(unzip -l "$APK" | grep -c 'libcraftya.so') adet |"
            echo "| ANativeActivity_onCreate (acilabilirlik) | $(grep -c 'ANativeActivity_onCreate' /tmp/syms.txt 2>/dev/null || echo '?') |"
            echo "| dex (hasCode=false beklenir) | $(unzip -l "$APK" | grep -cE 'classes[0-9]*\.dex') |"
          } >> $GITHUB_STEP_SUMMARY

      - name: APK artefakt
        uses: actions/upload-artifact@v4
        with:
          name: craftya-apk
          path: /tmp/apkout/*.apk
          if-no-files-found: error

      - name: Surum numarasini oku
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)
          echo "version=$VN" >> $GITHUB_OUTPUT
          echo "APK surumu: v$VN"

      - name: Release olustur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        continue-on-error: true
        run: |
          # onceki derlemelerin etiketleriyle cakismasin diye surum adindan
          # bagimsiz benzersiz bir etiket kullanilir: v<surum>-b<run>
          TAG="v${VERSION}-b${{ github.run_number }}"
          gh release create "$TAG" \
            /tmp/apkout/*.apk \
            --title "Craftya $VERSION (derleme ${{ github.run_number }})" \
            --notes "Craftya $VERSION · mobil odakli · ${{ github.sha }}" || \
          gh release upload "$TAG" /tmp/apkout/*.apk --clobber
